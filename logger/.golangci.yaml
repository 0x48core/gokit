linters:
  enable:
    - bodyclose
    - depguard
    - dogsled
    - errcheck
    - errorlint
    - exhaustive
    - exportloopref
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - gofmt
    - goprintffuncname
    - gosec
    - gosimple
    - govet
    - ineffassign
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - staticcheck
    - stylecheck
    - tparallel
    - typecheck
    - unconvert
    - unparam
    - whitespace

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false
  gocritic:
    disabled-checks:
      - ifElseChain
  golint:
    min-confidence: 0
  maligned:
    suggest-new: true
  dogsled:
    max-blank-identifiers: 3
  funlen:
    lines: 100
    statements: 60
  depguard:
    rules:
      main:
        allow:
          - $gostd
          - gitlab.ghn.vn
          - github.com

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - funlen
        - goconst
        - gosec
        - scopelint
        - ineffassign
    - path: \.go
      linters:
        - goconst
        - nakedret
        - typecheck
        - gofmt
  exclude:
    - G505
run:
  timeout: 10m
  skip-dirs:
    - mocks
  build-tags:
    - dynamic
